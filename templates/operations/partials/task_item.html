<div class="task-item"
     data-task-id="{{ task.pk }}"
     data-task-status="{{ task.status }}"
     data-assignee="{{ task.assignee }}"
     x-show="!selectedAssignee || selectedAssignee === '{{ task.assignee }}'">
  <button
    type="button"
    class="task-checkbox {% if task.status == 'done' %}done{% elif task.status == 'in_progress' %}in-progress{% endif %}"
    onclick="window.optimisticToggleTask && window.optimisticToggleTask(this)"
    hx-post="{% url 'operations-checklist:toggle_task' task.pk %}?oob_only=1"
    hx-swap="none"
    hx-sync="closest .task-item:replace"
    title="Klik sekali untuk menandai Selesai / Belum Selesai"
    aria-label="Ubah status tugas {{ task.title }}"
  >
    {% if task.status == 'done' %}<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>{% elif task.status == 'in_progress' %}<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>{% endif %}
  </button>

  <div class="task-title {% if task.status == 'done' %}done{% endif %}" style="flex: 1;">
    {{ task.title }}
  </div>

  <div class="task-meta">
    <div class="task-meta-badges" style="display: inline-flex; align-items: center; gap: 5px;">
      {% if task.due_date %}
      <span data-slot="badge"
            data-variant="{% if task.is_deadline_overdue and task.status != 'done' %}destructive{% else %}outline{% endif %}"
            class="font-mono tabular-nums"
            style="font-size: 0.75rem; gap: 4px;"
            title="Tenggat Waktu: {{ task.due_date|date:'d M Y' }}">
        <i data-lucide="calendar" style="width: 11px; height: 11px;"></i>
        {{ task.due_date|date:"d M" }}
      </span>
      {% endif %}

      {% if task.is_overdue and task.status != 'done' %}
      <button type="button" data-slot="icon-badge" data-variant="destructive" data-tooltip="Perlu Tindak Lanjut (Lewat Jadwal)" aria-label="Perlu Tindak Lanjut">
        <i data-lucide="alert-triangle"></i>
      </button>
      {% endif %}

      {% if task.is_critical %}
      <button type="button" data-slot="icon-badge" data-variant="warning" data-tooltip="Prioritas Utama" aria-label="Prioritas Utama">
        <i data-lucide="flame"></i>
      </button>
      {% endif %}

      {% if task.linked_tool %}
      <button type="button" data-slot="icon-badge" data-variant="primary" data-tooltip="Terkait: {{ task.linked_tool }}" aria-label="Terkait: {{ task.linked_tool }}">
        <i data-lucide="link-2"></i>
      </button>
      {% endif %}

      <!-- Compact Icon Badge: Assignee -->
      <button type="button" data-slot="icon-badge"
              {% if task.assignee == 'groom' %}data-variant="groom"{% elif task.assignee == 'bride' %}data-variant="bride"{% endif %}
              data-tooltip="PJ: {% if task.assignee == 'groom' %}Pria (Groom){% elif task.assignee == 'bride' %}Wanita (Bride){% else %}{{ task.get_assignee_display }}{% endif %}"
              aria-label="PJ: {{ task.get_assignee_display }}">
        {% if task.assignee == 'groom' %}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="14" r="5"/><path d="M19 5l-5.4 5.4"/><path d="M15 5h4v4"/></svg>
        {% elif task.assignee == 'bride' %}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="M12 14v7"/><path d="M9 18h6"/></svg>
        {% elif task.assignee == 'family' %}<i data-lucide="briefcase"></i>
        {% else %}<i data-lucide="users"></i>{% endif %}
      </button>

      <!-- Compact Icon Badge: Category -->
      <button type="button" data-slot="icon-badge" data-tooltip="Kategori: {{ task.get_category_display }}" aria-label="Kategori: {{ task.get_category_display }}">
        {% if task.category == 'finance' %}<i data-lucide="wallet"></i>
        {% elif task.category == 'venue' %}<i data-lucide="building-2"></i>
        {% elif task.category == 'legal' %}<i data-lucide="file-text"></i>
        {% elif task.category == 'vendor' %}<i data-lucide="store"></i>
        {% elif task.category == 'guest' %}<i data-lucide="mail"></i>
        {% elif task.category == 'logistic' %}<i data-lucide="truck"></i>
        {% elif task.category == 'fb' %}<i data-lucide="utensils"></i>
        {% elif task.category == 'rundown' %}<i data-lucide="clock"></i>
        {% elif task.category == 'asset' %}<i data-lucide="package"></i>
        {% elif task.category == 'post' %}<i data-lucide="sparkles"></i>
        {% else %}<i data-lucide="tag"></i>{% endif %}
      </button>

      <!-- Status Select -->
      <div class="wp-dropdown"
           x-data="customSelect({
             value: '{{ task.status }}',
             postUrl: '{% url 'operations-checklist:toggle_task' task.pk %}?oob_only=1',
             paramName: 'status',
             target: 'closest .task-item',
             swap: 'none',
             options: [
               { value: 'todo', label: 'Belum Selesai', pillClass: 'status-danger', dot: 'var(--wp-terracotta-main)' },
               { value: 'in_progress', label: 'Dalam Proses', pillClass: 'status-warning', dot: 'var(--wp-gold-main)' },
               { value: 'done', label: 'Selesai', pillClass: 'status-done', dot: 'var(--wp-sage-main)' }
             ]
           })"
           :class="{ 'is-open': open }"
           @click.outside="open = false"
           @keydown.escape.window="open = false">
        <button type="button"
                x-ref="trigger"
                class="wp-dropdown-trigger wp-dropdown-pill"
                :class="currentOption.pillClass"
                @click="toggle()"
                title="Pilih status tugas">
          <span style="display: inline-flex; align-items: center; gap: 6px;">
            <span class="wp-dropdown-dot" :style="'background:' + currentOption.dot"></span>
            <span x-text="currentOption.label"></span>
          </span>
          <svg class="wp-dropdown-chevron" :class="{ 'is-open': open }" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px; min-width: 12px; min-height: 12px; flex-shrink: 0;">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="wp-dropdown-panel"
             x-ref="panel"
             :class="{ 'is-dropup': dropUp, 'is-dropright': dropRight }"
             x-show="open"
             x-transition.opacity.scale.95
             x-cloak
             style="min-width: 165px;">
          <template x-for="opt in options" :key="opt.value">
            <div class="wp-dropdown-item"
                 :class="{ 'is-selected': value === opt.value }"
                 @click="window.optimisticSetTaskStatus && window.optimisticSetTaskStatus($el.closest('.task-item'), opt.value); select(opt)">
              <span style="display: inline-flex; align-items: center; gap: 8px;">
                <span class="wp-dropdown-dot" :style="'background:' + opt.dot"></span>
                <span x-text="opt.label"></span>
              </span>
              <svg class="wp-dropdown-check" x-show="value === opt.value" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 13px; height: 13px; min-width: 13px; min-height: 13px; flex-shrink: 0;">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
          </template>
        </div>
      </div>
    </div>

    <div class="task-actions">
      <button class="btn btn-ghost btn-icon btn-sm"
              hx-get="{% url 'operations-checklist:update_task' task.pk %}"
              hx-target="closest .task-item"
              hx-swap="outerHTML"
              title="Edit tugas"
              aria-label="Edit tugas"
              style="color: var(--muted-foreground);"><i data-lucide="pencil" style="width: 14px; height: 14px;"></i></button>
      <button class="btn btn-ghost btn-icon btn-sm"
              hx-delete="{% url 'operations-checklist:delete_task' task.pk %}"
              hx-confirm="Hapus tugas '{{ task.title }}'?"
              hx-target="closest .task-item"
              hx-swap="outerHTML"
              title="Hapus tugas"
              aria-label="Hapus tugas"
              style="color: var(--destructive);"><i data-lucide="trash-2" style="width: 14px; height: 14px;"></i></button>
    </div>
  </div>
</div>

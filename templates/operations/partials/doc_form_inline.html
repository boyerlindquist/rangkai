<tr style="border-bottom: 1px solid var(--wp-border-hover); background: var(--wp-bg-surface-subtle);" id="doc-{{ doc.pk }}">
  <td colspan="5" style="padding: 12px 20px;">
    <form hx-post="{% url 'operations-checklist:update_document' doc.pk %}"
          hx-target=".main-content"
          hx-select=".main-content"
          hx-swap="outerHTML show:none"
          hx-disinherit="hx-select hx-target hx-swap"
          style="display: flex; gap: 12px; align-items: flex-end; margin: 0; flex-wrap: wrap;">
      {% csrf_token %}
      <div style="flex: 2; min-width: 180px;">
        <label style="font-size: 0.76rem; font-weight: 600; color: var(--wp-text-secondary);">Nama Dokumen</label>
        {{ doc_form.name }}
      </div>
      <div style="flex: 1; min-width: 130px;">
        <label style="font-size: 0.76rem; font-weight: 600; color: var(--wp-text-secondary);">Pihak</label>
        {{ doc_form.party }}
      </div>
      <div style="flex: 1; min-width: 130px;">
        <label style="font-size: 0.76rem; font-weight: 600; color: var(--wp-text-secondary);">Status</label>
        {{ doc_form.status }}
      </div>
      <div style="flex: 2; min-width: 180px;">
        <label style="font-size: 0.76rem; font-weight: 600; color: var(--wp-text-secondary);">Catatan</label>
        {{ doc_form.notes }}
      </div>
      <div style="display: flex; gap: 6px; white-space: nowrap;">
        <button type="button"
                class="btn btn-secondary btn-sm"
                hx-get="{% url 'operations-checklist:update_document' doc.pk %}?cancel=1"
                hx-target="#doc-{{ doc.pk }}"
                hx-select="unset"
                hx-swap="outerHTML">Batal</button>
        <button type="submit" class="btn btn-gold btn-sm">Simpan</button>
      </div>
    </form>
  </td>
</tr>

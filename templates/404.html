{% extends "base.html" %}
{% load static %}
{% block title %}Halaman Tidak Ditemukan — Rangkai{% endblock %}

{% block body %}
<div class="auth-page">
  <div class="auth-card" style="text-align: center;">
    <div style="display: flex; justify-content: center; margin-bottom: 14px;">
      <span class="ui-brand-mark" style="width: 40px; height: 40px;">
        <img src="{% static 'img/logo.svg' %}?v=22" alt="Rangkai" style="width: 22px; height: 22px;" />
      </span>
    </div>

    <div class="font-mono tabular-nums" style="font-size: 2.75rem; font-weight: 700; line-height: 1; color: var(--primary); margin-bottom: 8px;">
      404
    </div>

    <h1 style="font-size: 1.25rem; font-weight: 650; color: var(--foreground); margin: 0 0 8px; letter-spacing: -0.02em;">
      Halaman Tidak Ditemukan
    </h1>

    <p style="color: var(--muted-foreground); font-size: 0.86rem; line-height: 1.5; margin: 0 0 22px;">
      Tautan yang kamu tuju mungkin telah dipindahkan, dihapus, atau alamat URL kurang tepat.
    </p>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <a href="{% url 'core:dashboard' %}" data-slot="button" data-variant="default" data-size="lg" style="width: 100%;">
        <i data-lucide="arrow-left"></i>
        <span>Kembali ke Beranda</span>
      </a>
      <a href="{% url 'core:guide' %}" data-slot="button" data-variant="outline" data-size="lg" style="width: 100%;">
        <i data-lucide="book-open"></i>
        <span>Buka Panduan Rangkai</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}

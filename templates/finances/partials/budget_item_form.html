<tr id="edit-budget-item-{{ item.pk }}">
  <td colspan="7">
    <form hx-post="{% url 'finances:update_item' item.pk %}"
          hx-target="closest tr"
          hx-swap="outerHTML"
          class="fade-in"
          style="background: var(--wp-bg-surface-subtle); padding: var(--wp-space-lg); border-radius: var(--wp-radius-sm); border: 1px solid var(--wp-border-light);">
      {% csrf_token %}
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--wp-space-md);">
        <h4 style="margin: 0; color: var(--wp-gold-main);"><i data-lucide="edit"></i> Edit {{ item.name }}</h4>
      </div>
      
      <div class="form-row" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--wp-space-md);">
        {% for field in form %}
          {% if field.name != 'wedding' %}
            <div class="form-group" style="margin-bottom: 0;">
              <label style="font-size: 0.85rem; font-weight: 600; color: var(--wp-text-secondary); margin-bottom: 4px; display: block;">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div style="color: var(--wp-terracotta-main); font-size: 0.8rem; margin-top: 4px;">{{ field.errors.0 }}</div>
              {% endif %}
            </div>
          {% endif %}
        {% endfor %}
      </div>
      
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: var(--wp-space-md);">
        <button type="button" class="btn btn-secondary btn-sm" hx-get="{% url 'finances:dashboard' %}" hx-target=".main-content" hx-select=".main-content" hx-swap="outerHTML">
          Batal
        </button>
        <button type="submit" class="btn btn-primary btn-sm">
          <i data-lucide="save"></i> Simpan
        </button>
      </div>
    </form>
    <script>
      setTimeout(() => lucide.createIcons(), 50);
    </script>
  </td>
</tr>

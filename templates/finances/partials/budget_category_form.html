{% load humanize %}
<form id="category-header-{{ cat.pk }}"
      hx-post="{% url 'finances:update_category' cat.pk %}"
      hx-target=".main-content"
      hx-select=".main-content"
      hx-swap="outerHTML show:none"
      hx-disinherit="hx-select hx-target hx-swap"
      novalidate
      @click.stop
      x-data="{
        totalBudget: {{ cat.wedding.total_budget|default:0|floatformat:0 }},
        nominal: {{ cat.allocated_amount|default:0|floatformat:0 }},
        pct: {{ cat.allocation_percentage|default:0|floatformat:2 }},
        onNominal() {
          const nom = Number(this.nominal) || 0;
          if (this.totalBudget > 0) {
            this.pct = Math.min(100, Math.round((nom / this.totalBudget) * 10000) / 100);
          }
        },
        onPct() {
          const p = Number(this.pct) || 0;
          if (this.totalBudget > 0) {
            this.nominal = Math.round((p / 100) * this.totalBudget);
          }
        }
      }"
      class="fade-in"
      style="flex: 1; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; background: var(--wp-bg-surface); padding: 12px 16px; border-radius: var(--wp-radius-sm); border: 1px solid var(--wp-sage-main);">
  {% csrf_token %}
  {{ form.icon.as_hidden }}
  <div class="form-group" style="flex: 2; min-width: 170px; margin-bottom: 0;">
    <label style="font-size: 0.76rem; font-weight: 600; color: var(--wp-text-secondary);">Nama Kategori</label>
    {{ form.name }}
  </div>
  <div class="form-group" style="flex: 1.3; min-width: 150px; margin-bottom: 0;">
    <label style="font-size: 0.76rem; font-weight: 600; color: var(--wp-text-secondary);">Pagu Nominal (Rp)</label>
    <input type="number"
           name="allocated_budget"
           class="wp-input tabular-nums"
           x-model.number="nominal"
           @input="onNominal()"
           min="0"
           step="any"
           placeholder="Contoh: 25000000">
  </div>
  <div class="form-group" style="width: 105px; margin-bottom: 0;">
    <label style="font-size: 0.76rem; font-weight: 600; color: var(--wp-text-secondary);">Atau Porsi (%)</label>
    <input type="number"
           name="allocation_percentage"
           class="wp-input tabular-nums"
           x-model.number="pct"
           @input="onPct()"
           min="0"
           max="100"
           step="any">
  </div>
  <div style="display: flex; gap: 8px;">
    <button type="button"
            class="btn btn-secondary btn-sm"
            hx-get="{% url 'finances:update_category' cat.pk %}?cancel=1"
            hx-target="#category-header-{{ cat.pk }}"
            hx-select="#category-header-{{ cat.pk }}"
            hx-swap="outerHTML">Batal</button>
    <button type="submit" class="btn btn-gold btn-sm">
      <i data-lucide="save"></i> Simpan
    </button>
  </div>
</form>

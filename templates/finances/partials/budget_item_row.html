{% load humanize %}
<tr>
  <td><strong>{{ item.name }}</strong></td>
  <td class="text-muted">{{ item.vendor_name|default:"—" }}</td>
  <td>Rp {{ item.actual_cost|intcomma }}</td>
  <td>Rp {{ item.paid_amount|intcomma }}</td>
  <td>
    <button
      class="badge {% if item.payment_status == 'settled' %}badge-sage{% elif item.payment_status == 'unpaid' %}badge-terracotta{% else %}badge-gold{% endif %}"
      hx-post="{% url 'finances:toggle_status' item.pk %}"
      hx-target="closest tr"
      hx-swap="outerHTML"
      style="cursor: pointer; border: none;"
    >
      {{ item.get_payment_status_display }}
    </button>
  </td>
  <td class="{% if item.is_overdue %}text-terracotta{% endif %}">
    {{ item.due_date|default:"—" }}
    {% if item.is_overdue %}<span style="font-size: 0.7rem;"> <i data-lucide="alert-triangle"></i> Overdue</span>{% endif %}
  </td>
  <td><span class="badge badge-muted">{{ item.get_payer_display }}</span></td>
  <td style="display: flex; gap: 4px;">
    <button
      class="btn btn-ghost btn-icon btn-sm"
      hx-get="{% url 'finances:update_item' item.pk %}"
      hx-target="closest tr"
      hx-swap="outerHTML"
      style="color: var(--wp-gold-main);"
    ><i data-lucide="pencil"></i></button>
    <button
      class="btn btn-ghost btn-icon btn-sm"
      hx-delete="{% url 'finances:delete_item' item.pk %}"
      hx-confirm="Hapus item {{ item.name }}?"
      hx-target=".main-content"
      hx-select=".main-content"
      hx-swap="outerHTML"
    ><i data-lucide="trash-2"></i></button>
  </td>
</tr>

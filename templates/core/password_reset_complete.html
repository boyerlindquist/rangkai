{% extends "base.html" %}
{% load static %}
{% block title %}Password Berhasil Diubah | Rangkai.click{% endblock %}

{% block body %}
<div class="auth-page">
  <div class="auth-card fade-in" style="text-align: center;">
    <div style="width: 48px; height: 48px; border-radius: 12px; margin: 0 auto 14px; background: var(--success-soft); border: 1px solid var(--success-border); color: var(--success); display: flex; align-items: center; justify-content: center;">
      <i data-lucide="check-circle-2" style="width: 22px; height: 22px;"></i>
    </div>
    <h1 style="margin: 0 0 8px; font-size: 1.25rem; font-weight: 700;">Password Berhasil Diperbarui</h1>
    <p style="margin: 0 0 20px; font-size: 0.86rem; color: var(--muted-foreground); line-height: 1.55;">
      Password akun <strong>Rangkai.click</strong> kamu sudah diperbarui. Silakan masuk kembali menggunakan password barumu.
    </p>
    <a href="{% url 'core:login' %}" class="btn btn-primary" style="width: 100%; justify-content: center;">
      Masuk Sekarang
    </a>
  </div>
</div>
{% endblock %}

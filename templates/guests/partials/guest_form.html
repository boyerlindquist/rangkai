<tr id="edit-guest-{{ guest.pk }}" class="fade-in">
  <td colspan="7" style="padding: 12px 20px; background: var(--wp-bg-surface-subtle);">
    <form hx-post="{% url 'guests:update' guest.pk %}"
          hx-target=".main-content"
          hx-select=".main-content"
          hx-swap="outerHTML show:none"
          hx-disinherit="hx-select hx-target hx-swap"
          class="rg-stack" style="display: grid; grid-template-columns: 1.5fr 1.1fr 1fr 0.9fr 0.6fr 0.9fr 1.2fr auto; gap: 8px; align-items: flex-end;">
      {% csrf_token %}
      <div>
        <label style="display: block; font-size: 0.75rem; color: var(--wp-text-secondary); margin-bottom: 3px; font-weight: 600;">Nama Tamu</label>
        {{ form.name }}
      </div>
      <div>
        <label style="display: block; font-size: 0.75rem; color: var(--wp-text-secondary); margin-bottom: 3px; font-weight: 600;">No Telp / WA</label>
        {{ form.phone }}
      </div>
      <div>
        <label style="display: block; font-size: 0.75rem; color: var(--wp-text-secondary); margin-bottom: 3px; font-weight: 600;">Relasi</label>
        {{ form.relation_side }}
      </div>
      <div>
        <label style="display: block; font-size: 0.75rem; color: var(--wp-text-secondary); margin-bottom: 3px; font-weight: 600;">Kategori</label>
        {{ form.category }}
      </div>
      <div>
        <label style="display: block; font-size: 0.75rem; color: var(--wp-text-secondary); margin-bottom: 3px; font-weight: 600;">Pax</label>
        {{ form.pax_allocation }}
      </div>
      <div>
        <label style="display: block; font-size: 0.75rem; color: var(--wp-text-secondary); margin-bottom: 3px; font-weight: 600;">RSVP</label>
        {{ form.rsvp_status }}
      </div>
      <div>
        <label style="display: block; font-size: 0.75rem; color: var(--wp-text-secondary); margin-bottom: 3px; font-weight: 600;">Catatan</label>
        {{ form.notes }}
      </div>
      <div style="display: flex; gap: 6px; padding-bottom: 2px;">
        <button type="button" class="btn btn-secondary btn-sm"
                hx-get="{% url 'guests:update' guest.pk %}?cancel=1"
                hx-target="closest tr"
                hx-select="unset"
                hx-swap="outerHTML"
                title="Batal">Batal</button>
        <button type="submit" class="btn btn-gold btn-sm" title="Simpan Perubahan"><i data-lucide="save" style="width: 14px; height: 14px;"></i> Simpan</button>
      </div>
    </form>
  </td>
</tr>

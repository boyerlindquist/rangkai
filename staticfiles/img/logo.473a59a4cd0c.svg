<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Rich Champagne Gold Gradients -->
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1DA"/>
      <stop offset="25%" stop-color="#E4C490"/>
      <stop offset="60%" stop-color="#B38144"/>
      <stop offset="85%" stop-color="#DEB980"/>
      <stop offset="100%" stop-color="#FBF0D8"/>
    </linearGradient>

    <linearGradient id="gold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E1"/>
      <stop offset="30%" stop-color="#D5AA69"/>
      <stop offset="70%" stop-color="#96692B"/>
      <stop offset="100%" stop-color="#E2BC85"/>
    </linearGradient>

    <linearGradient id="gold3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C79653"/>
      <stop offset="50%" stop-color="#FDEFD2"/>
      <stop offset="100%" stop-color="#AA7834"/>
    </linearGradient>
  </defs>

  <!-- 100% Transparent Background - Pure Luxury Emblem -->
  <g transform="translate(300, 300)" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Top Teardrop / Petal (Clean Thick Contour) -->
    <path d="M 0,-32 
             C -45,-85 -75,-165 0,-210 
             C 75,-165 45,-85 0,-32 Z" 
          fill="none" 
          stroke="url(#gold1)" 
          stroke-width="20"/>

    <!-- Bottom Teardrop / Petal -->
    <path d="M 0,32 
             C -45,85 -75,165 0,210 
             C 75,165 45,85 0,32 Z" 
          fill="none" 
          stroke="url(#gold1)" 
          stroke-width="20"/>

    <!-- Left Infinity Loop -->
    <path d="M 0,0 
             C -65,85 -145,105 -190,60 
             C -235,15 -215,-70 -160,-85 
             C -105,-100 -50,-40 0,0" 
          fill="none" 
          stroke="url(#gold2)" 
          stroke-width="20"/>

    <!-- Right Infinity Loop -->
    <path d="M 0,0 
             C 65,-85 145,-105 190,-60 
             C 235,-15 215,70 160,85 
             C 105,100 50,40 0,0" 
          fill="none" 
          stroke="url(#gold2)" 
          stroke-width="20"/>

    <!-- Dynamic Center Ribbon Weave (The 'Rangkai' Flow) -->
    <path d="M -150,-10 
             C -75,-40 -25,-10 0,0 
             C 25,10 75,40 150,10" 
          fill="none" 
          stroke="url(#gold3)" 
          stroke-width="12"/>

    <path d="M -120,25 
             C -60,40 -20,15 0,0 
             C 20,-15 60,-40 120,-25" 
          fill="none" 
          stroke="url(#gold1)" 
          stroke-width="8" 
          opacity="0.95"/>
  </g>
</svg>

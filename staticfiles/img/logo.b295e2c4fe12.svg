<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" class="rangkai-logo">
  <defs>
    <!-- Warm luxury mocha/bronze gradient matching Rangkai design tokens -->
    <linearGradient id="rk-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A079" />
      <stop offset="30%" stop-color="#A77A52" />
      <stop offset="70%" stop-color="#885B35" />
      <stop offset="100%" stop-color="#674122" />
    </linearGradient>

    <!-- Subtle luxury ambient shadow -->
    <filter id="rk-logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#24150B" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#rk-logo-shadow)">
    <!-- Top-Right Flourish & Calligraphic Stem -->
    <path
      d="M 96 124
         C 106 110, 118 94, 123 72
         C 127 50, 120 32, 106 23
         C 95 16, 84 22, 79 32
         C 75 42, 81 52, 90 52
         C 97 52, 101 46, 99 40
         C 97 34, 91 33, 87 36
         C 89 30, 95 26, 101 28
         C 111 32, 117 46, 113 67
         C 109 88, 96 106, 86 120
         C 84 123, 89 126, 96 124 Z"
      fill="url(#rk-logo-grad)"
    />

    <!-- Right Side Loop / Ribbon Flourish -->
    <path
      d="M 112 86
         C 126 80, 142 82, 153 92
         C 164 102, 163 118, 151 128
         C 139 138, 123 134, 114 122
         C 107 112, 111 99, 122 93
         C 130 89, 140 93, 140 101
         C 140 107, 134 111, 128 109
         C 124 107, 123 101, 129 97
         C 133 95, 139 99, 140 104
         C 141 110, 135 116, 127 114
         C 118 112, 113 103, 117 93
         C 119 88, 111 86, 106 88
         L 112 86 Z"
      fill="url(#rk-logo-grad)"
    />

    <!-- Bottom-Left Symmetrical Counterpart (180° Rotational Symmetry) -->
    <!-- Lower Calligraphic Stem -->
    <path
      d="M 104 76
         C 94 90, 82 106, 77 128
         C 73 150, 80 168, 94 177
         C 105 184, 116 178, 121 168
         C 125 158, 119 148, 110 148
         C 103 148, 99 154, 101 160
         C 103 166, 109 167, 113 164
         C 111 170, 105 174, 99 172
         C 89 168, 83 154, 87 133
         C 91 112, 104 94, 114 80
         C 116 77, 111 74, 104 76 Z"
      fill="url(#rk-logo-grad)"
    />

    <!-- Left Side Loop / Ribbon Flourish -->
    <path
      d="M 88 114
         C 74 120, 58 118, 47 108
         C 36 98, 37 82, 49 72
         C 61 62, 77 66, 86 78
         C 93 88, 89 101, 78 107
         C 70 111, 60 107, 60 99
         C 60 93, 66 89, 72 91
         C 76 93, 77 99, 71 103
         C 67 105, 61 101, 60 96
         C 59 90, 65 84, 73 86
         C 82 88, 87 97, 83 107
         C 81 112, 89 114, 94 112
         L 88 114 Z"
      fill="url(#rk-logo-grad)"
    />
  </g>
</svg>

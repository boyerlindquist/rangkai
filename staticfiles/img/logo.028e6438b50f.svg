<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="rangkai-logo">
  <defs>
    <!-- Warm Gold Gradient -->
    <linearGradient id="rk-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EADBCE" />
      <stop offset="40%" stop-color="#C0A888" />
      <stop offset="100%" stop-color="#967B5F" />
    </linearGradient>

    <!-- Warm Mocha Gradient -->
    <linearGradient id="rk-mocha" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A3425" />
      <stop offset="50%" stop-color="#6E503B" />
      <stop offset="100%" stop-color="#9C7959" />
    </linearGradient>

    <!-- Ribbon Sheen Overlay -->
    <linearGradient id="rk-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Deep Shadow for Overlap Depth -->
    <filter id="rk-depth-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#1F140E" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#rk-depth-shadow)">
    <!-- 1. Bottom/Under loop: From center down-right, around right loop, then through top-center -->
    <path
      d="M 50 50 
         C 59 63, 71 72, 82 72 
         C 93 72, 98 62, 98 50 
         C 98 38, 93 28, 82 28 
         C 71 28, 59 37, 50 50"
      stroke="url(#rk-mocha)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 2. Left loop (Continuous flow from top-center, around left loop, to bottom-center) -->
    <path
      d="M 50 50 
         C 41 63, 29 72, 18 72 
         C 7 72, 2 62, 2 50 
         C 2 38, 7 28, 18 28 
         C 29 28, 41 37, 50 50"
      stroke="url(#rk-gold)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3. Intertwined Over-weave across center (Gives the ribbon over-under knot effect) -->
    <path
      d="M 37 34 
         C 43 40, 47 46, 50 50 
         C 53 54, 57 60, 63 66"
      stroke="url(#rk-gold)"
      stroke-width="10"
      stroke-linecap="round"
    />

    <!-- 4. Subtle inner contour highlights for luxury embossed feel -->
    <path
      d="M 20 32 C 12 32, 6 40, 6 50 C 6 60, 12 68, 20 68 C 29 68, 38 60, 48 50 C 58 40, 67 32, 76 32"
      stroke="url(#rk-sheen)"
      stroke-width="1.5"
      stroke-linecap="round"
      fill="none"
      opacity="0.75"
    />
  </g>
</svg>
